<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена — В календарь</title>
    <meta name="description" content="Страница не найдена. Вернитесь на главную страницу генератора ICS.">
    <meta name="theme-color" content="#f6f5f2">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f4;
        --surface: #ffffff;
        --text: #1f252b;
        --muted: #68717a;
        --border: #ddd7cc;
        --accent: #426f68;
        --accent-text: #ffffff;
        --warm: #a86f4d;
        --warm-soft: #f2e7de;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 247, 244, 0.84)),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page-shell {
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: 32px 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--warm);
        box-shadow: 0 0 0 4px var(--warm-soft);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        line-height: 1.1;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.5;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        margin-top: 14px;
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-text);
        padding: 9px 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <p class="eyebrow">404</p>
      <h1>Страница не найдена</h1>
      <p>Адрес мог измениться или быть введён с ошибкой.</p>
      <p>Вернитесь к генератору события и скачайте готовый файл календаря.</p>
      <a class="button" href="./">На главную</a>
    </main>
  </body>
</html>
